# 個人專有詞典(範本)
#
# 複製成 dictionary.yaml 後填入你自己的詞:
#   cp dictionary.example.yaml dictionary.yaml
#
# 用途:
#   1. FunASR / SenseVoice 轉錄時當熱詞(hotword),提高專有名詞辨識率。
#      所有 list 型欄位裡的字串都會被攤平成熱詞;分類只是給人看的,可自行增減。
#   2. LLM 校對時的「專有名詞最終真理」:凡是這裡收錄的人名 / 產品 / 概念,
#      永遠以這裡的寫法為準,不因某個引擎或外部來源不同就改。
#
# 維護原則:
#   - 只放引擎不太可能認得的詞(人名、自創概念、產品名);通用詞不要加,熱詞太長反而干擾辨識
#   - 每條後面用註解記「誰、為什麼、哪份稿子第一次出現、引擎當時聽成什麼」,
#     校對時遇到近音字就能立刻對上
#   - 同一個詞只留一種寫法,其餘變體寫進 rules.yaml 做替換

people:
  # 常引用的作者 / 思想家(範例)
  - 榮格      # Carl Jung,《紅書》作者
  - 叔本華    # Arthur Schopenhauer;引擎曾全崩成「蘇廣華 / 蘇寶華」
  - 村上春樹
  # 真實人物、內在角色 … 依你的需要往下加

products_and_concepts:
  # 自己的專案、自創或常用的概念詞(範例)
  - 我的隨筆計畫
  - 第二大腦

tech_stack:
  - Obsidian
  - n8n
  - LlamaIndex

places:
  - 高雄
  - 臺北
